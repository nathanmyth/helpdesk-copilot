name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Unit tests + retrieval quality floor (no API key needed)
        run: pytest -v
      - name: Retrieval scorecard
        run: python -m eval.run_eval --retrieval-only
